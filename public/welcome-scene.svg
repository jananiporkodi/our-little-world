<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A couple sitting together under the moon">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A1A" />
      <stop offset="100%" stop-color="#2E2E2C" />
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAFAF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FAFAF8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232323" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="url(#sky)" />

  <g opacity="0.9">
    <circle cx="120" cy="70" r="1.6" fill="#FAFAF8" />
    <circle cx="200" cy="40" r="1.2" fill="#FAFAF8" />
    <circle cx="260" cy="90" r="1.8" fill="#FAFAF8" />
    <circle cx="340" cy="50" r="1.2" fill="#FAFAF8" />
    <circle cx="420" cy="30" r="1.6" fill="#FAFAF8" />
    <circle cx="500" cy="70" r="1.2" fill="#FAFAF8" />
    <circle cx="580" cy="45" r="1.8" fill="#FAFAF8" />
    <circle cx="650" cy="85" r="1.2" fill="#FAFAF8" />
    <circle cx="720" cy="55" r="1.6" fill="#FAFAF8" />
    <circle cx="90" cy="140" r="1.2" fill="#FAFAF8" />
    <circle cx="740" cy="130" r="1.2" fill="#FAFAF8" />
