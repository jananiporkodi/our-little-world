  <circle cx="580" cy="110" r="90" fill="url(#moonGlow)" />
  <circle cx="580" cy="110" r="46" fill="#FAFAF8" />
  <circle cx="598" cy="96" r="46" fill="#2E2E2C" opacity="0.94" />

  <rect x="0" y="300" width="800" height="200" fill="url(#water)" />
  <g opacity="0.5" stroke="#FAFAF8" stroke-width="1">
    <line x1="520" y1="305" x2="640" y2="305" />
    <line x1="500" y1="320" x2="660" y2="320" />
    <line x1="530" y1="335" x2="630" y2="335" />
  </g>

  <path d="M0 300 Q 60 292 120 300 T 240 300 T 360 300 T 480 300 T 600 300 T 720 300 T 800 300 V500 H0 Z" fill="#3A2E28" opacity="0.35" />

  <g transform="translate(430,330)">
    <ellipse cx="90" cy="150" rx="150" ry="20" fill="#C1443A" opacity="0.12" />
    <path d="M-40 150 L220 150 L 200 100 L -20 100 Z" fill="#C1443A" opacity="0.85" />
    <path d="M-20 100 L200 100 L190 90 L -10 90 Z" fill="#F6DEDC" opacity="0.9" />

    <ellipse cx="150" cy="118" rx="10" ry="9" fill="#232323" />
    <rect x="140" y="112" width="20" height="10" rx="2" fill="#F6DEDC" />

    <g transform="translate(55,60)">
      <ellipse cx="0" cy="55" rx="26" ry="30" fill="#232323" />
      <circle cx="-2" cy="15" r="15" fill="#3A2E28" />
    </g>
    <g transform="translate(95,58)">
      <ellipse cx="0" cy="55" rx="24" ry="30" fill="#4A3A32" />
      <circle cx="2" cy="12" r="14" fill="#232323" />
    </g>

